name: lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
          run-install: true
          cache: true

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          run-install: true
          cache: true

      - name: Generate Wayfinder Routes
        run: php artisan wayfinder:generate

      - name: Lint Backend
        id: backend-lint
        run: composer run lint:check
        continue-on-error: true

      - name: Lint Frontend
        id: frontend-lint
        run: npm run lint:check
        continue-on-error: true

      - name: Check Frontend Types
        id: frontend-types
        run: npm run types:check
        continue-on-error: true

      - name: Check Results
        if: steps.backend-lint.outcome == 'failure' || steps.frontend-lint.outcome == 'failure' || steps.frontend-types.outcome == 'failure'
        run: exit 1
